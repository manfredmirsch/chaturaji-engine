name: NNUE-Analyse

# Alle Partien aus dem Datensatz mit der Engine durchrechnen und die
# Auffälligkeiten annotieren.
#
# Warum in der Cloud: die Suche kostet in der Größenordnung 200 Rechenstunden.
# Auf vier Kernen sind das gut 50 Stunden am Stück; auf 32 Shards à 4 vCPU
# wenige Stunden je Job, und die laufen zwanzig gleichzeitig.
#
# Die Analyse ist zustandslos: keine Zufallszahlen, keine Reihenfolge über
# Partien hinweg. Jeder Shard nimmt jede n-te Datei der sortierten Liste, und
# ein Wiederholungslauf liefert dasselbe Ergebnis.
#
# MCTS wandert die Partie mit einem einzigen Baum ab (`advance` nach jedem
# Halbzug). Das ist billiger als ein Neustart je Stellung, koppelt die
# Stellungen innerhalb einer Partie aber aneinander — die Reihenfolge *in* der
# Partie zählt also, die über Partien hinweg nach wie vor nicht.

on:
  workflow_dispatch:
    inputs:
      search:
        description: 'Suche, die das Urteil fällt'
        type: choice
        options: ['mcts', 'brs']
        default: 'mcts'
      iters:
        description: 'Simulationen je Stellung (nur mcts)'
        type: number
        default: 25600
      depth:
        description: 'Suchtiefe (nur brs; 3 ist ~20x billiger als 4)'
        type: number
        default: 3
      shards:
        description: 'Parallele Runner (20 laufen gleichzeitig, der Rest wird angestellt)'
        type: number
        default: 4
      # MCTS braucht zwingend ein Netz — die Handbewertung taugt nicht als
      # Blattbewertung, weil sie nicht auf der Platzwertskala liegt.
      #
      # Die Vorgabe ist bewusst nicht 'weights.json': dieses Asset trägt seit
      # dem 15.09. das Ergebnis des q_weight-Versuchs (7.201.530 Schritte),
      # nicht das ausgelieferte Netz. Ein Lauf mit den Vorgaben nähme sonst
      # still das schwächere.
      weights:
        description: 'Netz für die Suche (Asset im Release nnue-state)'
        type: string
        default: 'weights-gen-r12.json'
      skip_book:
        description: 'Halbzüge am Partieanfang, die ungeprüft bleiben (Buchzüge)'
        type: number
        default: 16
      loss_min:
        description: 'Verlustschwelle für Anmerkungen in Platzwert (nur mcts)'
        type: string
        default: '0.12'
      calibrate:
        description: 'Nur die Verteilung der Verluste messen, nichts schreiben'
        type: boolean
        default: false
      limit:
        description: 'Partien je Shard (0 = alle; zum Kalibrieren z. B. 10)'
        type: number
        default: 0
      data_asset:
        description: 'Partiendatensatz (Asset im Release nnue-state)'
        type: string
        default: 'game_data.tar.gz'
      threshold:
        description: 'Score-Schwelle für Annotationen in Prozent'
        type: number
        default: 89
      release_tag:
        description: 'Release, an das das Ergebnis gehängt wird'
        type: string
        default: 'game-analysis'

env:
  STATE_TAG: nnue-state
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}

permissions:
  contents: write

# Zwei gleichzeitige Läufe würden dasselbe Release-Asset überschreiben.
concurrency:
  group: nnue-analyse
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Cargo-Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Analysator bauen
        run: cargo build --release -p chaturaji-nnue --bin analyze_games

      - name: Partien und Netz holen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p input
          for asset in '${{ inputs.data_asset }}' '${{ inputs.weights }}'; do
            [ -z "$asset" ] && continue
            if ! gh release download "$STATE_TAG" --pattern "$asset" --dir input --clobber; then
              echo "::error::'$asset' liegt nicht am Release '$STATE_TAG'."
              gh release view "$STATE_TAG" --json assets --jq '.assets[].name' \
                | sed 's/^/::error::  vorhanden: /'
              exit 1
            fi
          done
          ls -la input/

      - name: Shard-Liste
        id: shards
        run: |
          set -euo pipefail
          echo "matrix=$(seq 0 $(( ${{ inputs.shards }} - 1 )) | jq -R . | jq -s -c .)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: analyse-input
          retention-days: 2
          path: |
            target/release/analyze_games
            input/
          if-no-files-found: error

  analyse:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: analyse-input

      - name: Partien auspacken
        run: |
          set -euo pipefail
          mkdir -p games out
          # --strip-components=1: im Archiv liegt alles unter game_data/
          tar xf input/'${{ inputs.data_asset }}' -C games --strip-components=1
          n=$(find games -name '*.json' | wc -l)
          echo "$n Partien entpackt."
          [ "$n" -gt 0 ] || { echo "::error::Archiv enthält keine .json-Dateien."; exit 1; }

      - name: Analysieren
        run: |
          set -euo pipefail
          chmod +x target/release/analyze_games
          WEIGHTS=""
          [ -n '${{ inputs.weights }}' ] && WEIGHTS="--weights input/${{ inputs.weights }}"
          EXTRA=""
          [ '${{ inputs.calibrate }}' = 'true' ] && EXTRA="--calibrate"
          ./target/release/analyze_games \
            --limit ${{ inputs.limit }} $EXTRA \
            --in  games \
            --out out \
            --search    ${{ inputs.search }} \
            --iters     ${{ inputs.iters }} \
            --depth     ${{ inputs.depth }} \
            --threshold ${{ inputs.threshold }} \
            --skip-book ${{ inputs.skip_book }} \
            --loss-min  ${{ inputs.loss_min }} \
            --shard  ${{ matrix.shard }} \
            --shards ${{ inputs.shards }} \
            --force \
            $WEIGHTS

      - name: Ergebnis packen
        run: tar czf shard-$(printf '%03d' ${{ matrix.shard }}).tar.gz -C out .

      - uses: actions/upload-artifact@v7
        with:
          name: analyse-result-${{ matrix.shard }}
          path: shard-*.tar.gz
          retention-days: 2
          if-no-files-found: error

  sammeln:
    needs: analyse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: analyse-result-*
          merge-multiple: true
          path: shards

      - name: Verteilung der Verluste
        if: ${{ inputs.calibrate }}
        run: |
          set -euo pipefail
          mkdir -p roh
          for f in shards/*.tar.gz; do tar xf "$f" -C roh; done
          cat roh/losses-*.txt > alle.txt
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          v = sorted(float(x) for x in open('alle.txt'))
          n = len(v)
          q = lambda p: v[round((n - 1) * p)]
          anteil = lambda s: sum(1 for x in v if x >= s) / n * 100
          print(f"## Kalibrierung\n\n{n:,} geprüfte Halbzüge\n")
          print("| Quantil | Verlust |\n|---|---|")
          for p in (0.50, 0.75, 0.90, 0.95, 0.975, 0.99):
              print(f"| {p*100:.1f} % | {q(p):.3f} |")
          print(f"\nMittel {sum(v)/n:.3f}, Maximum {v[-1]:.3f}\n")
          print("| loss-min | Anmerkungen | davon ? | ⚠ | ⚡ |\n|---|---|---|---|---|")
          for s in (0.08, 0.10, 0.11, 0.12, 0.13, 0.15):
              print(f"| {s:.2f} | {anteil(s):.1f} % | {anteil(s)-anteil(s*2.5):.1f} % "
                    f"| {anteil(s*2.5)-anteil(s*3.75):.1f} % | {anteil(s*3.75):.2f} % |")
          PY

      - name: Zusammenlegen
        if: ${{ !inputs.calibrate }}
        id: pack
        run: |
          set -euo pipefail
          mkdir -p game_analysis
          for f in shards/*.tar.gz; do tar xf "$f" -C game_analysis; done
          n=$(find game_analysis -name '*.json' | wc -l)
          tar czf game_analysis.tar.gz -C game_analysis .
          {
            echo "n=$n"
            echo "size=$(du -h game_analysis.tar.gz | cut -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Zusammenfassung
        if: ${{ !inputs.calibrate }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, collections
          n = ann = plies = 0
          stufen = collections.Counter()
          for f in glob.glob('game_analysis/*.json'):
              d = json.load(open(f))
              n += 1
              plies += sum(1 for e in d.get('evals', []) if e)
              for a in d.get('annotations', []):
                  ann += 1
                  stufen[a['message'].split()[0]] += 1
          print(f"## Analyse fertig\n")
          print(f"| | |\n|---|---|")
          print(f"| Partien | {n:,} |")
          print(f"| Halbzüge | {plies:,} |")
          print(f"| Annotationen | {ann:,} |")
          for k, v in stufen.most_common():
              print(f"| {k} | {v:,} |")
          PY

      - name: Ans Release hängen
        if: ${{ !inputs.calibrate }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ inputs.release_tag }}'
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Partieanalysen" --notes \
              "Analysen aller Partien aus \`${{ inputs.data_asset }}\`. Wird von der NNUE-Analyse überschrieben."
          gh release upload "$TAG" game_analysis.tar.gz --clobber
          echo "${{ steps.pack.outputs.n }} Analysen (${{ steps.pack.outputs.size }}) an Release '$TAG' gehängt." \
            >> "$GITHUB_STEP_SUMMARY"
