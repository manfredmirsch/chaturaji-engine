[package]
name    = "chaturaji-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
chaturaji-core = { path = "../core" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Nur für die He-Initialisierung der NNUE-Gewichte. Beide bauen für
# wasm32-unknown-unknown, anders als rusqlite und rayon in chaturaji-nnue —
# genau deshalb liegt das Netz hier und nicht dort.
rand       = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"

[dev-dependencies]
chaturaji-trainer = { path = "../trainer" }
