[package]
name    = "chaturaji-nnue"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "train_nnue"
path = "src/bin/train_nnue.rs"

[dependencies]
chaturaji-core   = { path = "../core" }
chaturaji-engine = { path = "../engine" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rand       = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
rusqlite   = { version = "0.31", features = ["bundled"] }
rayon      = "1.10"
