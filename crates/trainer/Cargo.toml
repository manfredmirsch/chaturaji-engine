[package]
name    = "chaturaji-trainer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "train"
path = "src/main.rs"

[dependencies]
chaturaji-core   = { path = "../core" }
chaturaji-engine = { path = "../engine" }

# SQLite (bundled = kein System-SQLite nötig)
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialisierung der Netzgewichte
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Zufallszahlen für Netz-Initialisierung und Exploration
rand       = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"   # Normalverteilung für He-Initialisierung
