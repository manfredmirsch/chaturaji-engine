[package]
name    = "chaturaji-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
chaturaji-core   = { path = "../core" }
chaturaji-engine = { path = "../engine" }
wasm-bindgen      = "0.2"
serde             = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json        = "1"
js-sys            = "0.3"

# rand für WASM (ohne SQLite/trainer-Abhängigkeit)
rand     = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"

# getrandom braucht im Browser das js-Feature
getrandom = { version = "0.2", features = ["js"] }

[dependencies.web-sys]
version  = "0.3"
features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "console",
]

[profile.release]
opt-level = "s"
lto       = true
